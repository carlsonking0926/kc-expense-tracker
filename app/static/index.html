<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="K&C 記帳">
  <meta name="theme-color" content="#F6E2EA">
  <title>K&C 記帳</title>
  <link rel="manifest" href="/static/manifest.json">
  <link rel="icon" href="/static/icon-192.png">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>
  <header>
    <div class="month-row">
      <button id="prev-month" class="month-nav" aria-label="上個月">‹</button>
      <h1 id="month-label" class="month-name">—</h1>
      <button id="next-month" class="month-nav" aria-label="下個月">›</button>
    </div>
    <section class="summary-bar">
      <div class="sum-item income"><span>收入</span><b id="sum-income">NT$0</b></div>
      <div class="sum-item expense"><span>支出</span><b id="sum-expense">NT$0</b></div>
      <div class="sum-item balance"><span>結餘</span><b id="sum-balance">NT$0</b></div>
    </section>
    <div class="progress">
      <div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div>
      <div id="progress-text" class="progress-text">—</div>
    </div>
  </header>

  <main>
    <!-- 記一筆 -->
    <view id="view-add" class="view active">
      <form id="expense-form" class="card">
        <div class="kind-toggle">
          <button type="button" data-kind="expense" class="kind-btn active">支出</button>
          <button type="button" data-kind="income" class="kind-btn">收入</button>
        </div>
        <label>金額
          <input type="number" id="f-amount" inputmode="decimal" step="1" min="0" placeholder="0" required>
        </label>
        <label>日期
          <input type="date" id="f-date" required>
        </label>
        <label>分類
          <select id="f-category"></select>
        </label>
        <label>付款人
          <select id="f-member"></select>
        </label>
        <label>付款方式
          <select id="f-method"></select>
        </label>
        <label>備註
          <input type="text" id="f-note" placeholder="選填">
        </label>
        <button type="submit" class="primary">儲存這一筆</button>
      </form>
    </view>

    <!-- 清單 -->
    <view id="view-list" class="view">
      <ul id="expense-list" class="expense-list"></ul>
      <p id="list-empty" class="empty">本月還沒有紀錄</p>
    </view>

    <!-- 統計 -->
    <view id="view-stats" class="view">
      <div class="stats-head">
        <select id="stats-member" aria-label="篩選成員"></select>
      </div>
      <div class="chart-card"><h2>分類花費</h2><canvas id="chart-category"></canvas></div>
      <div class="chart-card"><h2>成員花費</h2><canvas id="chart-member"></canvas></div>
    </view>

    <!-- 設定 -->
    <view id="view-settings" class="view">
      <div class="setting-group" data-key="categories"><h2>支出分類</h2><div class="chips"></div>
        <div class="add-row"><input placeholder="新增分類"><button>加入</button></div></div>
      <div class="setting-group" data-key="members"><h2>家庭成員</h2><div class="chips"></div>
        <div class="add-row"><input placeholder="新增成員"><button>加入</button></div></div>
      <div class="setting-group" data-key="methods"><h2>付款方式</h2><div class="chips"></div>
        <div class="add-row"><input placeholder="新增方式"><button>加入</button></div></div>
    </view>
  </main>

  <nav class="tabbar">
    <button data-view="add" class="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8" stroke-linecap="round"/></svg>記帳</button>
    <button data-view="list">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12M3 6h.01M3 12h.01M3 18h.01"/></svg>清單</button>
    <button data-view="stats">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V10M12 20V4M19 20v-6"/></svg>統計</button>
    <button data-view="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.5-2.4 1a7 7 0 0 0-1.7-1L14.5 3h-5l-.3 2.5a7 7 0 0 0-1.7 1l-2.4-1-2 3.5 2 1.5a7 7 0 0 0 0 2l-2 1.5 2 3.5 2.4-1a7 7 0 0 0 1.7 1l.3 2.5h5l.3-2.5a7 7 0 0 0 1.7-1l2.4 1 2-3.5-2-1.5a7 7 0 0 0 .1-1z" stroke-linejoin="round"/></svg>設定</button>
  </nav>

  <!-- 編輯彈窗 -->
  <div id="edit-modal" class="modal" hidden>
    <div class="modal-card">
      <div class="modal-head">
        <h2>編輯這一筆</h2>
        <button type="button" id="edit-close" class="modal-x" aria-label="關閉">✕</button>
      </div>
      <form id="edit-form" class="card">
        <div class="kind-toggle">
          <button type="button" data-kind="expense" class="ekind-btn active">支出</button>
          <button type="button" data-kind="income" class="ekind-btn">收入</button>
        </div>
        <label>金額
          <input type="number" id="e-amount" inputmode="decimal" step="1" min="0" required>
        </label>
        <label>日期
          <input type="date" id="e-date" required>
        </label>
        <label>分類
          <select id="e-category"></select>
        </label>
        <label>付款人
          <select id="e-member"></select>
        </label>
        <label>付款方式
          <select id="e-method"></select>
        </label>
        <label>備註
          <input type="text" id="e-note" placeholder="選填">
        </label>
        <button type="submit" class="primary">儲存修改</button>
      </form>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
